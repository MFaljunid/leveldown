seed: 42
min_interactions: 5
datasets:
  ml-100k:
    raw_dir: data/raw/ml-100k
  ml-1m:
    raw_dir: data/raw/ml-1m
  gowalla:
    raw_dir: data/raw/gowalla
    core: 10
eval:
  k: 10
  bootstrap: 1000
grids:
  ials:
    dim:
    - 64
    alpha:
    - 1.0
    - 5.0
    - 20.0
    reg:
    - 1.0
    - 10.0
    - 100.0
    iters:
    - 10
  ease:
    lam:
    - 50.0
    - 200.0
    - 500.0
    - 2000.0
  knn:
    k:
    - 50
    - 200
  bpr:
    dim:
    - 64
    lr:
    - 0.05
    reg:
    - 0.0001
    - 0.001
    epochs:
    - 20
    - 40
    batch:
    - 4096
backbones:
- ials
- ease
- knn
ease_max_items: 12000
gate:
  primary_model: ials
  min_share: 0.4
  max_matched_ratio: 0.5
results_dir: results/gowalla
