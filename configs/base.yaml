# leveldown — shared settings (see docs/EXPERIMENT_LOG.md)
seed: 42
min_interactions: 5

datasets:
  ml-100k: {raw_dir: data/raw/ml-100k}     # u.data
  ml-1m:   {raw_dir: data/raw/ml-1m}       # ratings.dat
  gowalla: {raw_dir: data/raw/gowalla, core: 10}   # SNAP loc-gowalla_totalCheckins.txt(.gz); first visits, 10-core

eval:
  k: 10
  bootstrap: 1000

grids:                                     # selected on the validation item (NDCG@10, full ranking)
  ials: {dim: [64], alpha: [1.0, 5.0, 20.0], reg: [1.0, 10.0, 100.0], iters: [10]}
  ease: {lam: [50.0, 200.0, 500.0, 2000.0]}
  knn:  {k: [50, 200]}
  bpr:  {dim: [64], lr: [0.05], reg: [0.0001, 0.001], epochs: [20, 40], batch: [4096]}

backbones: [ials, ease, knn]               # EASE is skipped when n_items > ease_max_items (dense item x item)
ease_max_items: 12000

gate:                                      # C2' pre-registered rule
  primary_model: ials
  min_share: 0.40                          # test-item popularity explains >= 40% of the gap (OLS)
  max_matched_ratio: 0.50                  # |matched gap| <= 50% of |raw gap|